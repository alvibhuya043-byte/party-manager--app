<script>
    // Default credentials and state
    let appPassword = localStorage.getItem('party_app_password') || 'admin';
    let securityAnswer = localStorage.getItem('party_app_answer') || 'admin';

    // Verify Password on Login
    function verifyPassword(event) {
        event.preventDefault();
        const inputPass = document.getElementById('loginPassword').value;
        if (inputPass === appPassword) {
            document.getElementById('authModal').classList.add('hidden', 'opacity-0');
            document.getElementById('loginPassword').value = '';
        } else {
            alert('Incorrect password! Default is "admin".');
        }
    }

    // Modal Control Functions
    function openForgotModal() {
        const modal = document.getElementById('forgotModal');
        modal.classList.remove('hidden');
        setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    function closeForgotModal() {
        const modal = document.getElementById('forgotModal');
        modal.classList.add('opacity-0');
        setTimeout(() => modal.classList.add('hidden'), 300);
    }

    function openSettingsModal() {
        const modal = document.getElementById('settingsModal');
        modal.classList.remove('hidden');
        setTimeout(() => modal.classList.remove('opacity-0'), 10);
    }

    function closeSettingsModal() {
        const modal = document.getElementById('settingsModal');
        modal.classList.add('opacity-0');
        setTimeout(() => modal.classList.add('hidden'), 300);
    }

    // Password Recovery
    function resetPassword(event) {
        event.preventDefault();
        const answer = document.getElementById('securityAnswer').value.trim();
        const newPass = document.getElementById('newPasswordInput').value;

        if (answer.toLowerCase() === securityAnswer.toLowerCase()) {
            appPassword = newPass;
            localStorage.setItem('party_app_password', appPassword);
            alert('Password updated successfully!');
            closeForgotModal();
        } else {
            alert('Incorrect secret answer! Default is "admin".');
        }
    }

    // Change Password from Settings
    function changePassword(event) {
        event.preventDefault();
        const oldPass = document.getElementById('oldPass').value;
        const newPass = document.getElementById('newPass').value;

        if (oldPass === appPassword) {
            appPassword = newPass;
            localStorage.setItem('party_app_password', appPassword);
            alert('Password changed successfully!');
            document.getElementById('oldPass').value = '';
            document.getElementById('newPass').value = '';
            closeSettingsModal();
        } else {
            alert('Old password is incorrect.');
        }
    }

    // Biometric Login Placeholder
    function loginWithBiometric() {
        if (window.PublicKeyCredential) {
            alert('Biometric authentication simulated successfully. Unlocking app.');
            document.getElementById('authModal').classList.add('hidden', 'opacity-0');
        } else {
            alert('Biometric login is not supported on this browser/device.');
        }
    }

    function setupBiometric() {
        alert('Biometric login enabled successfully.');
    }
</script>
